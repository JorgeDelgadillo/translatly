name: Build release packages

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package browser extensions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare extension assets and types
        run: pnpm run setup:extension

      - name: Check the project
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm check:release "$RELEASE_TAG"

      - name: Build and package Chrome MV3
        run: pnpm zip

      - name: Build and package Firefox MV2
        run: pnpm zip:firefox

      - name: Prepare release packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          pnpm check:release "$RELEASE_TAG"

          chrome_package="$(find .output -maxdepth 1 -type f -name '*-chrome.zip' -print -quit)"
          firefox_package="$(find .output -maxdepth 1 -type f -name '*-firefox.zip' -print -quit)"
          test -n "$chrome_package"
          test -n "$firefox_package"

          cp "$chrome_package" "dist/translatly-${RELEASE_TAG}-chrome-mv3.zip"
          cp "$firefox_package" "dist/translatly-${RELEASE_TAG}-firefox-mv2.zip"

          for package in dist/*.zip; do
            unzip -l "$package" | grep -q 'manifest.json'
          done

          sha256sum dist/*.zip > dist/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: translatly-${{ github.event.release.tag_name }}-packages
          path: dist/*
          if-no-files-found: error

      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
