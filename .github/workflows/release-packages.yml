name: Build release packages

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package browser extensions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare extension assets and types
        run: pnpm run setup:extension

      - name: Check the project
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: pnpm check:release "$RELEASE_TAG"

      - name: Build and package Chrome MV3
        run: pnpm zip

      - name: Build and package Firefox MV2
        run: pnpm zip:firefox

      - name: Prepare release packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          pnpm check:release "$RELEASE_TAG"

          chrome_package="$(find .output -maxdepth 1 -type f -name '*-chrome.zip' -print -quit)"
          firefox_package="$(find .output -maxdepth 1 -type f -name '*-firefox.zip' -print -quit)"
          test -n "$chrome_package"
          test -n "$firefox_package"

          cp "$chrome_package" "dist/translatly-${RELEASE_TAG}-chrome-mv3.zip"
          cp "$firefox_package" "dist/translatly-${RELEASE_TAG}-firefox-mv2.zip"

          for package in dist/*.zip; do
            unzip -l "$package" | grep -q 'manifest.json'
          done

          sha256sum dist/*.zip > dist/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: translatly-${{ github.event.release.tag_name }}-packages
          path: dist/*
          if-no-files-found: error

      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
