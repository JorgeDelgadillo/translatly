name: Build release packages

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Package browser extensions
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the project
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build and package Chrome MV3
        run: pnpm zip

      - name: Build and package Firefox MV2
        run: pnpm zip:firefox

      - name: Prepare release packages
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          chrome_package="$(find .output -maxdepth 1 -type f -name '*-chrome.zip' -print -quit)"
          firefox_package="$(find .output -maxdepth 1 -type f -name '*-firefox.zip' -print -quit)"
          test -n "$chrome_package"
          test -n "$firefox_package"

          cp "$chrome_package" "dist/translatly-${RELEASE_TAG}-chrome-mv3.zip"
          cp "$firefox_package" "dist/translatly-${RELEASE_TAG}-firefox-mv2.zip"

          for package in dist/*.zip; do
            unzip -l "$package" | grep -q 'manifest.json'
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: translatly-${{ github.event.release.tag_name }}-packages
          path: dist/*.zip
          if-no-files-found: error

      - name: Attach packages to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber
